<!DOCTYPE html>
<html>
<head>
<title>Login / Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#eef2f7;
}

.box{
max-width:400px;
margin:auto;
margin-top:80px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 10px gray;
}
</style>

</head>

<body>

<div class="box">

<!-- LOGIN -->
<div id="loginBox">

<h2 class="text-center">
Login
</h2>

<input
type="text"
id="loginInput"
class="form-control mb-3"
placeholder="Email or Mobile">

<input
type="password"
id="loginPassword"
class="form-control mb-3"
placeholder="Password">

<button
class="btn btn-primary w-100"
onclick="loginUser()">

Login

</button>

<p class="text-center mt-3">

Don't have account?

<a href="#"
onclick="showRegister()">

Register

</a>

</p>

</div>

<!-- REGISTER -->
<div id="registerBox"
style="display:none;">

<h2 class="text-center">
Register
</h2>

<input type="text"
id="name"
class="form-control mb-2"
placeholder="Full Name">

<input type="email"
id="email"
class="form-control mb-2"
placeholder="Email">

<input type="text"
id="mobile"
class="form-control mb-2"
placeholder="Mobile Number">

<input type="password"
id="password"
class="form-control mb-2"
placeholder="Password">

<input type="text"
id="aadhaar"
class="form-control mb-2"
placeholder="Aadhaar Number">

<button
class="btn btn-success w-100"
onclick="registerUser()">

Register

</button>

<p class="text-center mt-3">

Already have account?

<a href="#"
onclick="showLogin()">

Login

</a>

</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
