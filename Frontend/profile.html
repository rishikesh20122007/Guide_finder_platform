<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guide Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.profile-card {
    border-radius: 20px;
    padding: 30px;
    background: white;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.profile-img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid #0d6efd;
}

.phase-box {
    background: #f1f1f1;
    padding: 10px 20px;
    border-radius: 10px;
}
</style>
</head>

<body style="background:#eef2f7;">

    <div class="container py-5">
        <div class="profile-card text-center">
            <h2>Guide Journey</h2>
            <img id="guideImg" class="profile-img my-3">
            <h4 id="guideName" class="text-primary"></h4>
            <div class="mt-4">
            <h5>Phases</h5>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
            <span class="phase-box">Register</span>
            <span class="phase-box">Availability</span>
            <span class="phase-box">Booking</span>
            <span class="phase-box">On Tour</span>
         </div>
         </div>
    <div class="mt-4">
        <h5>Details</h5>
        <p id="guideDetails"></p>
    </div>
        <button class="btn btn-success mt-4"
        onclick="bookGuide()">
        Book Guide
</button>
    </div>
    </div>
    <script src="profile.js"></script>

    <!-- BOOKING POPUP -->
<div id="bookingForm" style="
display:none;
position:fixed;
top:30%;
left:40%;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
z-index:1000;
width:300px;
">

<h3>Book Guide</h3>

<input type="text" id="userName"
class="form-control mb-2"
placeholder="Your Name">

<input type="date" id="date"
class="form-control mb-2">

<select id="time"
class="form-control mb-2">
<option value="">Select Time</option>
<option value="10:00">10:00 AM</option>
<option value="11:00">11:00 AM</option>
<option value="12:00">12:00 PM</option>
<option value="01:00">01:00 PM</option>
</select>

<button class="btn btn-success w-100 mb-2"
onclick="submitBooking()">
Confirm Booking
</button>

<button class="btn btn-danger w-100"
onclick="closeForm()">
Cancel
</button>

</div>

<script>
function bookGuide() {
  document.getElementById("bookingForm").style.display = "block";
}

function closeForm() {
  document.getElementById("bookingForm").style.display = "none";
}

async function submitBooking() {
  const guide = document.getElementById("guideName").innerText;

  const data = {
    guide: guide,
    user: document.getElementById("userName").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value
  };

  try {
    const res = await fetch("http://localhost:5000/book", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    alert(result.message);

    closeForm();

  } catch (error) {
    alert("❌ Server error");
  }
}
</script>

</body>
</html>
