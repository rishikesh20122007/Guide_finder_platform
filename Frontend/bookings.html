<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Book Your Trip</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:
    linear-gradient(135deg,#007bff,#00c6ff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Booking card */
.booking-box{
    background:white;
    width:500px;
    padding:40px;
    border-radius:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

.booking-title{
    text-align:center;
    color:#ff5a00;
    font-size:40px;
    font-weight:bold;
    margin-bottom:25px;
}

.form-control,
.form-select{
    border-radius:15px;
    padding:12px;
}

/* Button */
.book-btn{
    width:100%;
    background:#007bff;
    color:white;
    border:none;

    padding:14px;
    border-radius:30px;

    font-size:20px;
    font-weight:bold;

    transition:0.3s;
}

.book-btn:hover{
    background:#0056b3;
    transform:scale(1.03);
}

</style>
</head>

<body>

<div class="booking-box">

<h2 class="booking-title">
✈️ Book Your Tour
</h2>

<form id="bookingForm">

<input type="text"
class="form-control mb-3"
placeholder="Enter Full Name"
required>

<input type="email"
class="form-control mb-3"
placeholder="Enter Email"
required>

<input type="tel"
class="form-control mb-3"
placeholder="Phone Number"
required>

<select class="form-select mb-3"
required>

<option value="">
Select Place
</option>

<option>Shimla</option>
<option>Kerala</option>
<option>Ladakh</option>
<option>Ooty</option>
<option>Mysore</option>
<option>Rishikesh</option>
<option>Varanasi</option>
<option>Goa</option>
<option>Manali</option>
<option>Taj Mahal</option>
<option>Bihar</option>
<option>Rajasthan</option>

</select>

<input type="date"
class="form-control mb-3"
required>

<select class="form-select mb-4"
required>

<option value="">
Select Time Slot
</option>

<option>8:00 AM</option>
<option>10:00 AM</option>
<option>12:00 PM</option>
<option>2:00 PM</option>
<option>4:00 PM</option>

</select>

<button type="submit"
class="book-btn">

Book Now

</button>

</form>

</div>

<script>

document
.getElementById("bookingForm")
.addEventListener("submit",
function(e){

e.preventDefault();

alert(
"🎉 Booking Successful!"
);

this.reset();

});

</script>

</body>
</html>
