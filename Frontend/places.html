body{
    background:#f4f7fb;
}

/* TITLE */
.page-title{
    text-align:center;
    font-size:55px;
    font-weight:bold;
    color:#ff5a00;
    margin:40px 0;
}

/* CARD */
.place-card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    transition:0.4s;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);

    min-height:420px;
    background:white;
}

/* IMAGE */
.place-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

/* HOVER */
.place-card:hover{
    transform:
    translateY(-10px)
    scale(1.04);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

/* HIDDEN PRICE */
.price{
    opacity:0;
    transform:translateY(10px);

    font-size:24px;
    color:green;
    font-weight:bold;

    transition:0.4s;
}

/* SHOW PRICE ON HOVER */
.place-card:hover .price{
    opacity:1;
    transform:translateY(0);

    animation:
    glowPrice 1s infinite alternate;
}

@keyframes glowPrice{
    from{
        text-shadow:
        0 0 5px lime;
    }

    to{
        text-shadow:
        0 0 15px lime,
        0 0 25px lime;
    }
}

.book-btn{
    display:inline-block;
    text-decoration:none;

    background:#007bff;
    color:white;

    padding:10px 25px;
    border-radius:30px;
    border:none;
}

.book-btn:hover{
    background:#0056b3;
}

/* FIX CARD BODY */
.card-body{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;

    min-height:170px;
}

/* BUTTON FIX */
.book-btn{
    margin-top:15px;
    font-weight:bold;
    transition:0.3s;
}

.book-btn:hover{
    transform:scale(1.08);
}

</style>
</head>

<div class="modal fade" id="bookingModal">

<h4>Book Tour</h4>

</button>
</div>

<div class="modal-body">

<h5 id="selectedPlace"></h5>

<label class="fw-bold">
How Many Members?
</label>

<select
id="memberCount"
class="form-control mb-3"
onchange="generateMembers()">

<option value="">
Select Members
</option>

<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>

Travel Date
</label>

type="date"
id="travelDate"
class="form-control">

Time Slot
</label>

<select
id="timeSlot"
class="form-control">

<option value="">
Select Time
</option>

<option>10:00 AM</option>
<option>12:00 PM</option>
<option>2:00 PM</option>
<option>4:00 PM</option>
<option>6:00 PM</option>

<script>

let selectedPlaceName = "";

function bookPlace(placeName){

    const loggedInUser =
    JSON.parse(
    localStorage.getItem("loggedInUser")
    );

    if(!loggedInUser){

        alert("Please Login First");
        window.location.href =
        "index.html";
        return;
    }

    selectedPlaceName = placeName;
    const today =
    new Date()
    .toISOString()
    .split("T")[0];

    document.getElementById(
    "travelDate"
    ).min = today;

    document.getElementById(
    "selectedPlace"
    ).innerText =
    "Place: " + placeName;

    new bootstrap.Modal(
    document.getElementById(
    "bookingModal"
    )).show();
}


function generateMembers(){

    const count =
    document.getElementById(
    "memberCount"
    ).value;

    const container =
    document.getElementById(
    "membersContainer"
    );

    container.innerHTML = "";

    for(let i=1;i<=count;i++){

container.innerHTML += `

    <div class="border p-3 rounded mb-3 bg-light shadow-sm">

    <h5 class="text-primary">
    Member ${i}
    </h5>

    <div class="row">

    <div class="col-md-6">
    <input
    type="text"
    id="name${i}"
    class="form-control"
    placeholder="👤 Member Name">
    </div>

    <div class="col-md-6">
    <input
    type="number"
    id="whatsapp${i}"
    class="form-control"
    placeholder="📱 WhatsApp Number">
    </div>

    </div>

    </div>

    `;
    }
}


async function submitBooking(){

    const loggedInUser =
    JSON.parse(
    localStorage.getItem(
    "loggedInUser"
    ));

    const members =
    document.getElementById(
    "memberCount"
    ).value;

    const travelDate =
    document.getElementById(
    "travelDate"
    ).value;

    const timeSlot =
    document.getElementById(
    "timeSlot"
    ).value;

    const memberDetails = [];

    for(let i=1;i<=members;i++){

        const name =
        document.getElementById(
        `name${i}`
        ).value;

        const whatsapp =
        document.getElementById(
        `whatsapp${i}`
        ).value;

        if(!name || !whatsapp){

            alert(
            "Fill all member details"
            );

            return;
        }

        memberDetails.push({
            name,
            whatsapp
        });
    }

    if(!travelDate ||
       !timeSlot){

        alert(
        "Select Date and Time"
        );

        return;
    }

    try{

        const response =
        await fetch(
        "https://guide-finder-platform.onrender.com/book-guide",{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

body:JSON.stringify({

    placeName:
    selectedPlaceName,

    totalMembers:
    members,

    members:
    memberDetails,

    bookedBy:
    loggedInUser.name,

    date:
    travelDate,

    time:
    timeSlot
})
        });

        const result =
        await response.json();

        alert(
        "Booking Successful ✅"
        );

        location.reload();

    }

    catch(error){

        console.log(error);

        alert(
        "Booking Failed"
        );
    }
}

</script>
