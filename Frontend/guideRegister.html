<!DOCTYPE html>
<html>
<head>
    <title>Guide Register</title>
</head>
<body>

<h2>Guide Register</h2>

<input type="text"
id="guideName"
placeholder="Name">

<br><br>

<input type="email"
id="guideEmail"
placeholder="Email">

<br><br>

<input type="text"
id="guideMobile"
placeholder="Mobile Number">

<br><br>

<input type="password"
id="guidePassword"
placeholder="Password">

<br><br>

<input type="text"
id="guideLocation"
placeholder="Location">

<br><br>

<input type="text"
id="guideLanguages"
placeholder="Languages (Hindi, English etc)">

<br><br>

<input type="number"
id="price"
placeholder="Price">

<br><br>

<input type="number"
id="experience"
placeholder="Experience (Years)">

<br><br>

<textarea
id="bio"
placeholder="About Yourself">
</textarea>

<br><br>

<input type="text"
id="photo"
placeholder="Photo URL">

<br><br>

<button onclick="registerGuide()">
Register
</button>

<script src="guideAuth.js"></script>

</body>
</html>
